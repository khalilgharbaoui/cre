name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  spec:
    name: Ruby ${{ matrix.ruby }} / Rails ${{ matrix.rails }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ruby: '2.7', rails: '6.1' }
          - { ruby: '3.2', rails: '7.1' }
          - { ruby: '3.3', rails: '7.2' }
          - { ruby: '3.4', rails: '8.0' }
          - { ruby: '3.4', rails: '8.1' }
    env:
      RAILS_VERSION: ${{ matrix.rails }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - run: bundle install
      - run: bundle exec rspec
